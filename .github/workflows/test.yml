# SPDX-License-Identifier: LGPL-2.1-or-later
name: Test

# build.sh の構成と build.yml の分岐・権限の検査（node:test。依存パッケージなし）。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node --test
